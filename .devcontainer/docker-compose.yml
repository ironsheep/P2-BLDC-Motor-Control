services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Name the built image so Docker reuses cached layers across rebuilds.
    image: p2-bldc-motor-control-dev:local
    volumes:
      - ..:/workspaces/P2-BLDC-Motor-Control:cached
      # Persist todo-mcp task data across container rebuilds. Must be a named
      # volume -- a host bind mount corrupts SQLite over the Docker Desktop fs.
      - todo-mcp-data:/home/node/.local/share/todo-mcp
    # No ports published: this workspace runs no servers.
    # No devices passed: Docker Desktop on macOS cannot forward USB, so the
    # PropPlug is unreachable from here -- bench runs stay on the Mac.
    command: sleep infinity
    # Note: postCreateCommand, extensions, and settings live in
    # devcontainer.json. Tooling is baked into the image via Dockerfile.

volumes:
  todo-mcp-data:
