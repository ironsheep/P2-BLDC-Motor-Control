# Release: on a pushed version tag, build the three archive sets and open a DRAFT release.
#
# Pushing the tag is the maintainer's act, and so is publishing: this creates the release as a draft,
# with the tag's CHANGELOG.md entry as its page and the three zips attached. Nothing is public until the
# draft is published on GitHub. tools/make-release.sh does all the building, and can be run locally with
# --preview to see exactly what a release will contain.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Build the archive sets and the release notes
        run: tools/make-release.sh "${GITHUB_REF_NAME}" --ref HEAD --out "dist/${GITHUB_REF_NAME}"

      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "dist/${GITHUB_REF_NAME}/release-notes.md" \
            "dist/${GITHUB_REF_NAME}/demo-1mot-archive-set.zip" \
            "dist/${GITHUB_REF_NAME}/demo-2mot-archive-set.zip" \
            "dist/${GITHUB_REF_NAME}/serial-control-archive-set.zip"
